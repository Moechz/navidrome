<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navidrome Music Server</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #101418; color: #d8dee6;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  .card { text-align: center; }
  .disc {
    width: 96px; height: 96px; margin: 0 auto 20px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #fff 0 14%, #0084ff 15% 46%, #0a6fd0 47% 62%, #0084ff 63% 100%);
    box-shadow: 0 6px 30px rgba(0, 132, 255, .35);
    animation: spin 6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: #4da3ff; }
</style>
</head>
<body>
  <div class="card">
    <div class="disc"></div>
    <p>正在打开 Navidrome（版本 @@VERSION@@）…</p>
    <p>若未自动跳转，请点击 <a href="/navidrome/">/navidrome/</a></p>
  </div>
  <script>location.replace('/navidrome/');</script>
</body>
</html>
