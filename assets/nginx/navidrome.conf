# Navidrome for TOS 7 — nginx 反代（WebUI External Open / 新标签页模式）
# 官方模板: help.terra-master.com → Deb Development Specification → Nginx Configuration
# 安装位置: /usr/local/navidrome/nginx/navidrome.conf
# 平台将其加载进 TOS nginx；location 前缀必须与 config.ini 的 path 一致
# 注意：此处保留 /navidrome/ 前缀转发（metube 同款方案）——Navidrome 以
# --baseurl /navidrome 原生运行在子路径，SPA/Subsonic API/分享链接全部自洽；
# 不要写 proxy_pass http://127.0.0.1:8453/（尾斜杠会剥离前缀，导致绝对路径 404）
location /navidrome/ {
    proxy_pass http://127.0.0.1:8453/navidrome/;
    proxy_http_version 1.1;
    # Host 用 $http_host（带端口）：Navidrome 依据 Host 生成分享链接/封面等
    # 绝对 URL，用 $host（不含端口）会生成丢端口的错误链接
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket 升级（网页播放器的实时通知/事件流需要）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # 音频流/转码可能耗时较长
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # 流式响应不缓冲，保证拖动进度条即点即播
    proxy_buffering off;
}
# 无尾斜杠访问补一个 301（用户手输地址的容错）
# absolute_redirect off: 输出相对 Location，避免 TOS nginx 构造绝对 URL 时
# 丢失端口（实测 port_in_redirect 环境下会踢到 80 端口）
location = /navidrome {
    absolute_redirect off;
    return 301 /navidrome/;
}
